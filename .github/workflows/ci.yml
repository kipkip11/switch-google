name: Switch-Google CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality-and-tests:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check (TypeScript Verification)
        run: npm run type-check

      - name: Run Unit Tests with Coverage (Native Engine)
        run: npm test -- --coverage

      - name: Run Unit Tests with Coverage (Forced Fallback Engine)
        run: TEST_FALLBACK_SQLITE=1 npm test

      - name: Build Project
        run: npm run build

      - name: Security Vulnerability Scan
        run: npm audit --audit-level=critical || true
